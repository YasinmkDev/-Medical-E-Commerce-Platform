<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust & Regulatory Accreditation Strip - GlobalParamedics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    /* Scoped container styles for seamless Elementor embedding */
    .ap-section-container {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#ffffff] text-[#000000] antialiased m-0 p-0">

<section class="ap-section-container bg-[#ffffff] border-b border-[#e0e0e0]/70 py-8 sm:py-10">
  <div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
    
    <!-- Metric Statistics Bar -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-6 text-center divide-y md:divide-y-0 md:divide-x divide-[#e0e0e0]">
      <div class="pt-3 md:pt-0 px-2 flex flex-col items-center justify-center">
        <span class="text-[26px] sm:text-[32px] font-bold text-[#0a3922] leading-tight tracking-[-0.019em]">
          10,000+
        </span>
        <span class="text-[13px] text-[#7a7a7a] font-medium mt-1">
          Active Clinicians & EMTs
        </span>
      </div>
      <div class="pt-3 md:pt-0 px-2 flex flex-col items-center justify-center">
        <span class="text-[26px] sm:text-[32px] font-bold text-[#0a3922] leading-tight tracking-[-0.019em]">
          99.4%
        </span>
        <span class="text-[13px] text-[#7a7a7a] font-medium mt-1">
          First-Stick Success Rate
        </span>
      </div>
      <div class="pt-3 md:pt-0 px-2 flex flex-col items-center justify-center">
        <span class="text-[26px] sm:text-[32px] font-bold text-[#0a3922] leading-tight tracking-[-0.019em]">
          14 Min
        </span>
        <span class="text-[13px] text-[#7a7a7a] font-medium mt-1">
          Avg WhatsApp Response
        </span>
      </div>
      <div class="pt-3 md:pt-0 px-2 flex flex-col items-center justify-center">
        <span class="text-[26px] sm:text-[32px] font-bold text-[#0a3922] leading-tight tracking-[-0.019em]">
          100%
        </span>
        <span class="text-[13px] text-[#7a7a7a] font-medium mt-1">
          ISO 13485 Calibrated
        </span>
      </div>
      <div class="pt-3 md:pt-0 px-2 flex flex-col items-center justify-center">
        <span class="text-[26px] sm:text-[32px] font-bold text-[#0a3922] leading-tight tracking-[-0.019em]">
          2-Hour
        </span>
        <span class="text-[13px] text-[#7a7a7a] font-medium mt-1">
          Emergency City Dispatch
        </span>
      </div>
    </div>

    <!-- Regulatory & Institutional Accreditation Strip -->
    <div class="pt-6 border-t border-[#e0e0e0] flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-[12px] font-semibold uppercase tracking-wider text-[#7a7a7a]">
        <svg class="w-4 h-4 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>Official Clinical Accreditations & Standards:</span>
      </div>

      <div class="flex flex-wrap items-center justify-center md:justify-end gap-3 sm:gap-4">
        <div class="bg-[#f2f2f2] hover:bg-[#d2f2e3] text-[#3d3d3d] hover:text-[#0a3922] text-[12px] font-semibold px-3 py-1 rounded-[9999px] transition-colors border border-[#e0e0e0] flex items-center gap-1.5" title="European Medical Device Conformity">
          <svg class="w-3.5 h-3.5 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
          <span>CE Mark 0123</span>
        </div>
        <div class="bg-[#f2f2f2] hover:bg-[#d2f2e3] text-[#3d3d3d] hover:text-[#0a3922] text-[12px] font-semibold px-3 py-1 rounded-[9999px] transition-colors border border-[#e0e0e0] flex items-center gap-1.5" title="Medical Devices Quality Management">
          <svg class="w-3.5 h-3.5 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>ISO 13485:2016</span>
        </div>
        <div class="bg-[#f2f2f2] hover:bg-[#d2f2e3] text-[#3d3d3d] hover:text-[#0a3922] text-[12px] font-semibold px-3 py-1 rounded-[9999px] transition-colors border border-[#e0e0e0] flex items-center gap-1.5" title="Good Manufacturing Practice Standard">
          <svg class="w-3.5 h-3.5 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>WHO-GMP Compliant</span>
        </div>
        <div class="bg-[#f2f2f2] hover:bg-[#d2f2e3] text-[#3d3d3d] hover:text-[#0a3922] text-[12px] font-semibold px-3 py-1 rounded-[9999px] transition-colors border border-[#e0e0e0] flex items-center gap-1.5" title="Drug & Medical Device Authority Regulated">
          <svg class="w-3.5 h-3.5 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>DRAP Registered</span>
        </div>
        <div class="bg-[#f2f2f2] hover:bg-[#d2f2e3] text-[#3d3d3d] hover:text-[#0a3922] text-[12px] font-semibold px-3 py-1 rounded-[9999px] transition-colors border border-[#e0e0e0] flex items-center gap-1.5" title="Tactical Emergency & Hemorrhage Standards">
          <svg class="w-3.5 h-3.5 text-[#0a3922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>CoTCCC Benchmark</span>
        </div>
      </div>
    </div>

  </div>
</section>

</body>
</html>
