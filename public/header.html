<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Navigation & Urgent Helpline - GlobalParamedics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    /* Scoped container styles for seamless Elementor embedding */
    .ap-section-container {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#ffffff] text-[#000000] antialiased m-0 p-0">

<header class="ap-section-container sticky top-0 z-40 bg-[#ffffff] border-b border-[#e0e0e0]/70">
  <!-- Upper Clinical Urgent Bar -->
  <div class="bg-[#0a3922] text-[#d2f2e3] text-[13px] py-1.5 px-4 sm:px-6">
    <div class="max-w-[1280px] mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-[#1dbf73] animate-pulse"></span>
        <span class="font-medium text-white">Emergency Paramedic Dispatch & Technical Support:</span>
        <a href="tel:+923008472910" class="text-white/90 font-mono tracking-wide hover:underline">+92 300 8472910</a>
      </div>
      <div class="flex items-center gap-4 text-[12px]">
        <span class="hidden md:inline text-white/80">Official Distributor: Vein Detectors & EMS Supplies</span>
        <span class="bg-white/10 text-white px-2.5 py-0.5 rounded-full font-mono font-medium">
          Currency: <strong class="text-white">PKR / USD</strong>
        </span>
      </div>
    </div>
  </div>

  <!-- Main Navigation Bar -->
  <div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-4">
    <!-- Brand Logo -->
    <a href="#" class="flex items-center gap-2.5 group text-decoration-none">
      <div class="w-10 h-10 rounded-xl bg-[#0a3922] flex items-center justify-center text-white font-bold shadow-sm">
        <div class="relative w-5 h-5 flex items-center justify-center">
          <div class="absolute w-5 h-1.5 bg-[#1dbf73] rounded-sm"></div>
          <div class="absolute w-1.5 h-5 bg-[#1dbf73] rounded-sm"></div>
        </div>
      </div>
      <div class="flex flex-col">
        <span class="text-[20px] font-bold tracking-tight text-[#0a3922] leading-tight">
          Global<span class="text-[#ff643b]">Paramedics</span>
        </span>
        <span class="text-[11px] font-semibold text-[#7a7a7a] tracking-wider uppercase">
          Medical Devices & EMS
        </span>
      </div>
    </a>

    <!-- Center Nav Links -->
    <nav class="hidden lg:flex items-center gap-7 text-[15px] font-medium text-[#0a3922]">
      <a href="#categories" class="hover:text-[#ff643b] transition-colors">Categories</a>
      <a href="#recommended" class="hover:text-[#ff643b] transition-colors flex items-center gap-1">
        Clinical Recommendations
        <span class="bg-[#d2f2e3] text-[#0a3922] text-[11px] px-2 py-0.5 rounded-full font-bold">New</span>
      </a>
      <a href="#products" class="hover:text-[#ff643b] transition-colors">Equipment Catalog</a>
      <a href="#about-us" class="hover:text-[#ff643b] transition-colors">Why Clinicians Trust Us</a>
      <a href="#procurement" class="hover:text-[#ff643b] transition-colors">Hospital Bulk Orders</a>
    </nav>

    <!-- Right Actions -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Search Trigger -->
      <a href="#search-section" class="p-2.5 rounded-full text-[#0a3922] hover:bg-[#eee2ff]/60 transition-colors flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </a>

      <!-- WhatsApp Direct Clinical Inquiry Button -->
      <a href="https://wa.me/923008472910?text=Hello%20GlobalParamedics,%20I%20would%20like%20to%20inquire%20about%20medical%20equipment." target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 bg-[#ffffff] text-[#0a3922] border border-[#000000] text-[14px] font-medium py-2 px-4 rounded-[40px] hover:bg-[#0a3922] hover:text-[#ffffff] transition-colors">

        <span>WhatsApp Order</span>
      </a>
    </div>
  </div>
</header>

</body>
</html>
